<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/styles/style.css" />
    <script src="./app.js" defer></script>
    <title>Chatbot about me</title>
  </head>

  <body>
    <main>
      <section>
        <article class="answers">
          <img
            src="./assets/images/random.jpgg"
            alt="Billede af random billede for test..."
          />

          <h1>🙈 Chatbot about me 🙈</h1>
          <p>Lyseblå = spørgsmål</p>
          <p>Orange = amaBOT</p>

          <form id="question-form" method="POST" action="/ask">
            <textarea
              id="question"
              name="question"
              placeholder="Skriv en besked til mig"
              required
            ></textarea>

            <button type="submit">Ask</button>
          </form>

          <button type="button" id="clear-messages-button">Ryd beskeder</button>

          <section id="messages"></section>

          <h2>Spørgsmål fordelt på emner</h2>

          <ul>
            <li>Navn: <span id="stats-navn">0</span></li>
            <li>By: <span id="stats-by">0</span></li>
            <li>Hobby: <span id="stats-hobby">0</span></li>
          </ul>
        </article>
      </section>
    </main>
  </body>
</html>
